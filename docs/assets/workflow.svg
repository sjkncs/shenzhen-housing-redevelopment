<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" role="img" aria-labelledby="title desc">
<title id="title">From data coverage to project identification</title><desc id="desc">Source coverage, area diagnostics and supporting audits are executed. Verified coordinates, project boundary assignment and project effects remain pending. Audits are not causal identification.</desc>
<style>.bg{fill:#f0f5f3}.ink{fill:#233d45}.muted{fill:#526a73}.done{fill:#fff;stroke:#85aaa0}.pending{fill:#fff;stroke:#b0a18a}@media(prefers-color-scheme:dark){.bg{fill:#161b22}.ink{fill:#edf3f4}.muted{fill:#b6c6ce}.done,.pending{fill:#202830}}</style>
<rect class="bg" width="900" height="316" rx="8"/>
<g font-family="Verdana,Microsoft YaHei,sans-serif"><text x="24" y="31" font-size="12" class="ink">EXECUTED / 已执行：数据与诊断</text><text x="24" y="159" font-size="12" class="ink">PENDING / 待核定：正式项目识别</text></g>
<g stroke-width="1.2"><rect class="done" x="24" y="47" width="264" height="82" rx="6"/><rect class="done" x="318" y="47" width="264" height="82" rx="6"/><rect class="done" x="612" y="47" width="264" height="82" rx="6"/><rect class="pending" x="24" y="175" width="264" height="82" rx="6"/><rect class="pending" x="318" y="175" width="264" height="82" rx="6"/><rect class="pending" x="612" y="175" width="264" height="82" rx="6"/></g>
<g font-family="Verdana,Microsoft YaHei,sans-serif"><g font-size="17" class="ink"><text x="42" y="78">来源覆盖与规则清洗</text><text x="336" y="78">片区 DID 与动态诊断</text><text x="630" y="78">身份线索与口径审计</text><text x="42" y="206">坐标依据与拆除边界</text><text x="336" y="206">住宅归属与比较样本</text><text x="630" y="206">项目效应与机制检验</text></g><g font-size="11" class="muted"><text x="42" y="106">Platform data, not an official census</text><text x="336" y="106">Pre-event differences remain</text><text x="630" y="106">Evidence leads, not acceptance</text><text x="42" y="234">Independent spatial verification</text><text x="336" y="234">Exposure + anticipation + shocks</text><text x="630" y="234">Only after identification gates</text></g><text x="24" y="291" font-size="11" class="muted">Completed audits do not establish causal identification / 当前尚无已接受的项目空间处理样本</text></g>
