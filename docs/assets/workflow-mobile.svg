<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" role="img" aria-labelledby="title desc">
<title id="title">Research identification gates</title><desc id="desc">Executed audits versus pending project identification. Completed diagnostics are not causal effects.</desc>
<style>.bg{fill:#f0f5f3}.ink{fill:#233d45}.muted{fill:#526a73}@media(prefers-color-scheme:dark){.bg{fill:#161b22}.ink{fill:#edf3f4}.muted{fill:#b6c6ce}}</style>
<rect class="bg" width="360" height="414" rx="8"/>
<g fill="none" stroke="#85aaa0" stroke-width="2"><path d="M28 60V158"/><circle cx="28" cy="60" r="5"/><circle cx="28" cy="110" r="5"/><circle cx="28" cy="160" r="5"/></g>
<g fill="none" stroke="#b0a18a" stroke-width="2" stroke-dasharray="4 4"><path d="M28 241V339"/><circle cx="28" cy="241" r="5"/><circle cx="28" cy="291" r="5"/><circle cx="28" cy="341" r="5"/></g>
<g font-family="Verdana,Microsoft YaHei,sans-serif"><g font-size="12" class="ink"><text x="20" y="30">EXECUTED / 已执行：数据与诊断</text><text x="20" y="212">PENDING / 待核定：项目识别</text></g><g font-size="17" class="ink"><text x="49" y="64">来源覆盖与规则清洗</text><text x="49" y="114">片区 DID 与动态诊断</text><text x="49" y="164">身份线索与口径审计</text><text x="49" y="246">坐标依据与拆除边界</text><text x="49" y="296">住宅归属与比较样本</text><text x="49" y="346">项目效应与机制检验</text></g><g font-size="10" class="muted"><text x="49" y="82">Platform sample, not official census</text><text x="49" y="132">Pre-event differences remain</text><text x="49" y="182">Evidence leads, not acceptance</text><text x="49" y="264">Independent spatial verification</text><text x="49" y="314">Exposure + anticipation + shocks</text><text x="49" y="364">Only after identification gates</text><text x="20" y="395">Completed audits are not causal identification.</text></g></g>
</svg>
